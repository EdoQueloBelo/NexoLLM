name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. The more precise you are, the faster it gets fixed.
  - type: input
    id: version
    attributes:
      label: NexoLLM version
      description: Settings → About
      placeholder: 0.2.0 (15)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.7, MacBook Air M2 16 GB
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App you were writing in
      placeholder: Safari on gmail.com, Mail, WhatsApp...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you typed, what NexoLLM did, what you expected instead. Screenshots help a lot. Please leave out anything private.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: Turn on detailed logging in Settings → About, reproduce, then paste the relevant lines of ~/Library/Logs/NexoLLM.log. Check them for private text first.
      render: text
