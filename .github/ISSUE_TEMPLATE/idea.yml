name: Idea
description: Something NexoLLM should do, or do better
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like, and in which situation would it help you?
    validations:
      required: true
  - type: input
    id: apps
    attributes:
      label: Apps where it matters
      placeholder: Mail, Slack, Notion...
